name: Release

# Publishes Kassi Security Inspections for WordPress to the JetBrains Marketplace on a version tag
# (e.g. `v0.1.1`). The FIRST version is uploaded manually (plugins.jetbrains.com/plugin/add); every
# later version is published by pushing a tag (or by the kassi-devtools rotating auto-publisher).
# Free plugin (no product-descriptor): this just uploads a new version.
#
# Required secret:  PUBLISH_PAT  — JetBrains Marketplace token (NOT a GitHub PAT); wired to PUBLISH_TOKEN.
# Optional secrets: CERTIFICATE_CHAIN, PRIVATE_KEY, PRIVATE_KEY_PASSWORD (plugin signing; the
#                   Marketplace also signs uploads itself).

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (without leading v, e.g. 0.1.1)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish to Marketplace
    runs-on: ubuntu-latest
    steps:
      - name: Check out (with the rules and corpus submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The Plugin Verifier downloads full PhpStorm distributions; without this the runner can run out
      # of disk mid-download and die with no log (bit SWIFT 1.1.0).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      # Gate 1: the test suite, including the real-CVE corpus acceptance tests.
      - name: Test
        run: ./gradlew test -PpluginVersion=${{ steps.ver.outputs.version }} --stacktrace

      # Gate 2: blocks the release on compatibility problems or scheduled-for-removal API (PS 2025.3 + newest).
      - name: Verify plugin
        run: ./gradlew verifyPluginStructure verifyPlugin -PpluginVersion=${{ steps.ver.outputs.version }} --stacktrace

      - name: Build plugin
        run: ./gradlew buildPlugin -PpluginVersion=${{ steps.ver.outputs.version }} --stacktrace

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_PAT }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin -PpluginVersion=${{ steps.ver.outputs.version }} --stacktrace

      - name: Attach distribution to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: plugin/build/distributions/*.zip
          generate_release_notes: true
