# ---------------------------------------------------------------------------------------------
# Pinned versions. Each value was checked against its upstream source on 2026-10-20 — do not
# bump from memory; re-check the source named in the comment.
# ---------------------------------------------------------------------------------------------

# IntelliJ Platform Gradle Plugin 2.x. Source: plugins.gradle.org maven-metadata
# (org.jetbrains.intellij.platform), 2.19.0 published 2026-09-14.
intellijPlatformGradlePluginVersion=2.19.0

# Kotlin Gradle plugin. Source: repo1.maven.org kotlin-gradle-plugin, 2.4.20 published 2026-09-07
# (2.4.21 skipped: <2 weeks old). The *language/API level* is pinned lower, to what the 2025.3 IDE
# bundles — see kotlinApiVersion.
kotlinVersion=2.4.20
# The IDE supplies kotlin-stdlib at runtime; never compile against a newer API than the floor IDE
# (2025.3) bundles. Source: IntelliJ SDK docs "Using Kotlin" → Kotlin Standard Library table.
kotlinApiVersion=2.2

# Target platform = the compatibility FLOOR (decided: min PhpStorm 2025.3). Source:
# data.services.jetbrains.com/products/releases?code=PS — 2025.3 = build 253.28294.345.
platformVersion=2025.3
pluginSinceBuild=253

# Plugin Verifier matrix: both ends of the open-ended range. Floor = 2025.3 GA; top = newest PS
# release 2026.2.3 (262.10968.76, 2026-09-17). Same source as above.
verifierIdeVersions=2025.3,2026.2.3

# JDK: 2025.3+ platform requires Java 21. Source: IntelliJ SDK docs "Build Number Ranges".
javaVersion=21

pluginGroup=io.github.vadimtoptunov
pluginVersion=0.1.0-SNAPSHOT

# The IDE bundles kotlin-stdlib; do not ship our own copy inside the plugin.
kotlin.stdlib.default.dependency=false
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
